name: Pre-commit checks

# yamllint disable-line rule:truthy
on:
  pull_request:
  pull_request:
  push:
    tags-ignore:
      - "**"
permissions:
  contents: read
jobs:
  pre-commit:
    if: github.repository_owner == 'SukramJ'
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies for hooks
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pre-commit
        pre-commit run --files custom_components/homematicip_local/light.py custom_components/homematicip_local/sensor.py custom_components/homematicip_local/switch.py custom_components/homematicip_local/climate.py
        with:
          extra_args: --all-files
